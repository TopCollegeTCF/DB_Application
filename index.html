<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Цифровая Академия — Вход</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 55%, #6d28d9 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
  }

  .bg-grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  .glow {
    position: fixed; border-radius: 50%; filter: blur(70px); opacity: .35; pointer-events: none;
  }
  .glow-a { width: 340px; height: 340px; background: #22d3ee; top: -120px; right: -80px; }
  .glow-b { width: 380px; height: 380px; background: #a78bfa; bottom: -160px; left: -100px; }

  .card {
    position: relative;
    width: 640px; max-width: 100%;
    text-align: center;
    padding: 56px 48px;
    border-radius: 24px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(10px);
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
  }

  .logo {
    width: 64px; height: 64px; border-radius: 16px;
    margin: 0 auto 24px;
    background: linear-gradient(135deg, #22d3ee, #a78bfa);
    display: grid; place-items: center;
    font-weight: 800; font-size: 24px; color: #0f172a;
    box-shadow: 0 8px 24px rgba(34,211,238,.35);
  }

  h1 {
    font-size: 34px; font-weight: 800; line-height: 1.15; margin-bottom: 12px;
    background: linear-gradient(90deg, #ffffff, #c7d2fe);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle {
    font-size: 16px; color: #cbd5e1; margin-bottom: 36px; line-height: 1.5;
  }

  .btn {
    display: inline-flex; align-items: center; gap: 12px;
    font-size: 16px; font-weight: 700;
    padding: 16px 36px; border-radius: 999px;
    background: linear-gradient(90deg, #22d3ee, #a78bfa);
    color: #0f172a; text-decoration: none;
    box-shadow: 0 12px 32px rgba(167,139,250,.4);
    transition: transform .2s, box-shadow .2s;
  }
  .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 18px 40px rgba(167,139,250,.55);
  }
  .btn svg { transition: transform .2s; }
  .btn:hover svg { transform: translateX(4px); }

  .hint {
    margin-top: 28px; font-size: 12.5px; color: #94a3b8;
  }
  .hint code {
    background: rgba(0,0,0,.35); padding: 2px 8px; border-radius: 6px;
    color: #67e8f9; font-family: 'Consolas', monospace;
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="glow glow-a"></div>
<div class="glow glow-b"></div>

<div class="card">
  <div class="logo">ЦА</div>

  <h1>Цифровая Академия</h1>
  <p class="subtitle">
    База данных · Спринт 1<br>
    Нажми кнопку, чтобы перейти к слайдам с заданиями
  </p>

  <a class="btn" href="./dock/index.html">
    Открыть слайды
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="5" y1="12" x2="19" y2="12"></line>
      <polyline points="12 5 19 12 12 19"></polyline>
    </svg>
  </a>

  <p class="hint">
    Файл слайдов: <code>dock/index.html</code>
  </p>
</div>

</body>
</html>
